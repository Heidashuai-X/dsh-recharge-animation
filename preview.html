<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>dsh-recharge-animation · 独立预览</title>
<style>
	/* A mock of the DSH shell, with the same theme variables the plugin reads. */
	:root {
		--dsw-alias-bg-base: #0e0e12;
		--dsw-alias-bg-layer-1: #16161c;
		--dsw-alias-border-l1: rgba(127, 127, 127, .22);
		--dsw-alias-brand-primary: #4d6bfe;
		--dsw-alias-label-primary: #e6e6e6;
		--dsw-alias-label-secondary: rgba(190, 190, 196, .92);
		--dsw-alias-label-tertiary: rgba(127, 127, 127, .9);
		--dsw-specific-sidebar-fill: #121218;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		margin: 0;
		background: var(--dsw-alias-bg-base);
		color: var(--dsw-alias-label-primary);
		font: 400 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Microsoft YaHei", sans-serif;
	}
	.mock { display: flex; height: 100vh; }
	.mock-bar {
		width: 248px; flex: none; display: flex; flex-direction: column;
		background: var(--dsw-specific-sidebar-fill);
		border-right: 1px solid var(--dsw-alias-border-l1);
	}
	.mock-brand { padding: 16px 18px; font-weight: 600; letter-spacing: .04em; }
	.mock-nav { flex: 1; padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }
	.mock-nav span { padding: 8px 10px; border-radius: 8px; color: var(--dsw-alias-label-secondary); }
	.mock-nav span.on { background: rgba(127, 127, 127, .14); color: var(--dsw-alias-label-primary); }
	.mock-foot {
		display: flex; align-items: center; gap: 4px; padding: 10px 12px;
		border-top: 1px solid var(--dsw-alias-border-l1);
	}
	.mock-gear {
		display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px;
		border: 0; border-radius: 10px; background: transparent;
		color: var(--dsw-alias-label-secondary); cursor: pointer;
		font: inherit;
	}
	.mock-main { flex: 1; padding: 34px 40px; overflow: auto; }
	.mock-main h1 { margin: 0 0 6px; font-size: 20px; }
	.mock-main p { margin: 0 0 18px; color: var(--dsw-alias-label-secondary); max-width: 62ch; }
	.mock-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; max-width: 900px; }
	.mock-card {
		border: 1px solid var(--dsw-alias-border-l1); border-radius: 14px; padding: 16px;
		background: var(--dsw-alias-bg-layer-1); color: var(--dsw-alias-label-secondary);
	}
	.account {
		max-width: 560px; border: 1px solid var(--dsw-alias-border-l1); border-radius: 16px;
		padding: 22px; background: var(--dsw-alias-bg-layer-1);
	}
	.account h2 { margin: 0 0 8px; font-size: 16px; }
	.account p { margin: 0 0 12px; color: var(--dsw-alias-label-secondary); }
	.account .tag {
		display: inline-block; margin: 0; padding: 4px 10px; border-radius: 999px;
		background: rgba(77, 107, 254, .16); color: #9db0ff;
		font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px;
	}
	.note {
		position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 14px;
		background: rgba(0, 0, 0, .5); color: var(--dsw-alias-label-tertiary);
		font-size: 12px; text-align: center;
	}
</style>
</head>
<body>
	<div class="mock">
		<aside class="mock-bar">
			<div class="mock-brand">DeepSeek Harness</div>
			<nav class="mock-nav">
				<span class="on">对话</span>
				<span>任务板</span>
				<span>技能</span>
				<span>档案</span>
			</nav>
			<div class="mock-foot" id="seat-footer">
				<button type="button" class="mock-gear" title="设置（宿主自带，此处仅占位）">⚙ 设置</button>
			</div>
		</aside>
		<main class="mock-main" id="mock-main">
			<h1>一个假的 DSH 主区</h1>
			<p>它的唯一用途是给毛玻璃当背景：点侧边栏底部的「充值」，遮罩会把这整页糊掉，再淡出打开官方充值页；<strong>右键那个按钮</strong>会打开设置面板（图标、音效、文案、预设）。</p>
			<div class="mock-cards">
				<div class="mock-card">背景卡片一<br />blur(72px) saturate(1.9) 会把这里糊成一片柔光。</div>
				<div class="mock-card">背景卡片二<br />插件跟随 --dsw-* 变量，亮暗主题都能用。</div>
				<div class="mock-card">背景卡片三<br />进度条是「真实信号 + 时间兜底」的混合语义。</div>
			</div>
		</main>
	</div>
	<div id="seat-overlay"></div>
	<div class="note" id="boot-note">正在加载 React 与插件…</div>

	<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
	<script>
		(function () {
			var footer = document.getElementById("seat-footer");
			var overlay = document.getElementById("seat-overlay");
			var main = document.getElementById("mock-main");
			var note = document.getElementById("boot-note");

			// Stands in for the official top-up page the plugin opens in a new window.
			var lastHandover = "(还没点)";
			function showTopUp() {
				main.innerHTML = "";
				var box = document.createElement("div");
				box.className = "account";
				box.innerHTML =
					"<h2>官方充值页（替身）</h2>" +
					"<p>真实环境里动画收尾会打开 <strong>platform.deepseek.com/top_up</strong> 的新窗口；预览页不跳转，只把这次交接记下来。</p>" +
					"<p class=\"tag\">" + lastHandover + "</p>";
				main.appendChild(box);
			}

			// The real build hands the URL to the OS browser; a preview tab should not
			// spawn windows, so the hand-over is recorded instead.
			window.open = function (url) {
				lastHandover = "window.open(" + JSON.stringify(url) + ", \"_blank\")";
				note.textContent = "插件请求打开 " + url + "（预览页已拦截）";
				showTopUp();
				return { closed: false };
			};

			// --- a fake Host half ------------------------------------------------
			// The plugin talks to /recharge-animation/* exactly as it does inside DSH.
			// Here those routes are answered from memory, so the panel, the asset
			// service and the show can be exercised without starting the desktop app.
			// Two deliberate differences from the real Host, because a file:// page
			// cannot do better: uploaded files become blob URLs, and remote URLs
			// cannot be fetched. Everything else follows the same contract.
			var ROUTE = "/recharge-animation";
			var LIMITS = { icon: 4 * 1024 * 1024, audio: 8 * 1024 * 1024 };
			var FORMATS = { icon: "png / jpg / webp / gif", audio: "mp3 / wav / ogg / m4a" };
			var STORE_KEY = "dsh-recharge-animation-preview";
			var SEED = {
				version: 1,
				muted: false,
				labels: { button: "充值", skipHint: "点击跳过" },
				behavior: { duration: 1800, minDuration: 1100, skippable: true, progressMode: "real", openTopUp: true, platformTop: 40 },
				assets: { icons: [], audio: [] },
				presets: [{ id: "p-default", name: "默认", iconId: null, slots: { intro: null, bgm: null, outro: null }, volumes: { intro: 100, bgm: 60, outro: 100 } }],
				activePresetId: "p-default"
			};
			var config = readConfig();

			/** Blob URLs do not survive a reload, so the asset index is session-only. */
			function readConfig() {
				var fresh = JSON.parse(JSON.stringify(SEED));
				var raw = null;
				try { raw = localStorage.getItem(STORE_KEY); } catch (error) { raw = null; }
				if (!raw) return fresh;
				try {
					var parsed = JSON.parse(raw);
					if (!parsed || typeof parsed !== "object") return fresh;
					parsed.assets = { icons: [], audio: [] };
					parsed.presets = parsed.presets && parsed.presets.length > 0 ? parsed.presets : fresh.presets;
					for (var i = 0; i < parsed.presets.length; i++) {
						parsed.presets[i].iconId = null;
						parsed.presets[i].slots = { intro: null, bgm: null, outro: null };
					}
					return parsed;
				} catch (error) { return fresh; }
			}

			function writeConfig() {
				try { localStorage.setItem(STORE_KEY, JSON.stringify(config)); } catch (error) { /* full or blocked */ }
			}

			function jsonResponse(body, status) {
				return new Response(JSON.stringify(body), {
					status: status || 200,
					headers: { "Content-Type": "application/json; charset=utf-8" }
				});
			}

			function hostPayload() {
				return {
					ok: true,
					enabled: true,
					config: config,
					limits: LIMITS,
					formats: FORMATS,
					labelMax: { button: 24, skipHint: 40 },
					presetNameMax: 24,
					assetNameMax: 80
				};
			}

			function listKeyOf(kind) { return kind === "audio" ? "audio" : "icons"; }

			function storeAsset(kind, blob, name, done) {
				var id = (kind === "audio" ? "a-" : "i-") + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);
				done({
					id: id,
					file: id + (/\.([a-z0-9]+)$/i.exec(name) ? "." + /\.([a-z0-9]+)$/i.exec(name)[1].toLowerCase() : ""),
					bytes: blob.size,
					name: name,
					ms: Date.now(),
					url: URL.createObjectURL(blob)
				});
			}

			function readJsonBody(init) {
				if (!init || typeof init.body !== "string") return Promise.resolve(null);
				try { return Promise.resolve(JSON.parse(init.body)); } catch (error) { return Promise.resolve(null); }
			}

			/** The fake router: same paths, same shapes, same error strings. */
			function handleHost(path, query, method, init) {
				return new Promise(function (resolve) {
					if (path === "/config") {
						if (method === "GET") { resolve(jsonResponse(hostPayload())); return; }
						readJsonBody(init).then(function (body) {
							var next = body && body.config ? body.config : body;
							if (next && typeof next === "object") {
								if (next.labels) config.labels = next.labels;
								if (next.behavior) config.behavior = next.behavior;
								if (next.presets && next.presets.length > 0) config.presets = next.presets;
								if (next.activePresetId) config.activePresetId = next.activePresetId;
								config.muted = next.muted === true;
							}
							writeConfig();
							resolve(jsonResponse(hostPayload()));
						});
						return;
					}
					if (path === "/assets") {
						var kind = query.get("kind") === "audio" ? "audio" : "icon";
						var list = config.assets[listKeyOf(kind)];
						if (method === "DELETE") {
							var id = query.get("id");
							var kept = [];
							for (var i = 0; i < list.length; i++) {
								if (list[i].id !== id) kept.push(list[i]);
							}
							config.assets[listKeyOf(kind)] = kept;
							for (var p = 0; p < config.presets.length; p++) {
								if (config.presets[p].iconId === id) config.presets[p].iconId = null;
								if (config.presets[p].slots.intro === id) config.presets[p].slots.intro = null;
								if (config.presets[p].slots.bgm === id) config.presets[p].slots.bgm = null;
								if (config.presets[p].slots.outro === id) config.presets[p].slots.outro = null;
							}
							writeConfig();
							resolve(jsonResponse(hostPayload()));
							return;
						}
						if (method === "POST") {
							var posted = init && init.body;
							var name = decodeURIComponent(query.get("name") || "asset");
							var blob = posted instanceof Blob ? posted : new Blob([posted || ""], { type: "application/octet-stream" });
							if (blob.size > LIMITS[kind]) {
								resolve(jsonResponse({
									error: (kind === "icon" ? "图片" : "音频") + "超过上限 " + (LIMITS[kind] / 1024 / 1024) + "MB（当前 " + (blob.size / 1024 / 1024).toFixed(1) + "MB）"
								}, 413));
								return;
							}
							storeAsset(kind, blob, name, function (entry) {
								config.assets[listKeyOf(kind)].push(entry);
								writeConfig();
								resolve(jsonResponse(hostPayload(), 201));
							});
							return;
						}
						resolve(jsonResponse({ error: "不支持的方法" }, 405));
						return;
					}
					if (path === "/import-url" && method === "POST") {
						readJsonBody(init).then(function () {
							resolve(jsonResponse({ error: "预览页跨不过 CORS：请在真机里用 URL 导入，这里请用「选择文件」或拖拽" }, 400));
						});
						return;
					}
					resolve(jsonResponse({ error: "没有这条路由" }, 404));
				});
			}

			var realFetch = typeof window.fetch === "function" ? window.fetch.bind(window) : null;
			window.fetch = function (input, init) {
				var raw = typeof input === "string" ? input : (input && input.url ? input.url : String(input));
				var parsed = null;
				try { parsed = new URL(raw, location.href); } catch (error) { parsed = null; }
				// On file:// a rooted path resolves to "/D:/…", so the route is looked
				// up inside the path instead of matched as a prefix.
				var at = parsed === null ? -1 : parsed.pathname.indexOf(ROUTE);
				if (at < 0) {
					if (realFetch !== null) return realFetch(input, init);
					return Promise.reject(new Error("fetch is unavailable"));
				}
				var method = ((init && init.method) || "GET").toUpperCase();
				return handleHost(parsed.pathname.slice(at + ROUTE.length), parsed.searchParams, method, init);
			};

			function hostFor(name) {
				if (name === "sidebar.footer.action") return footer;
				if (name === "shell.overlay") return overlay;
				return null;
			}

			if (!window.React || !window.ReactDOM) {
				note.textContent = "React 未能从 unpkg 载入（离线？），预览不可用。";
				return;
			}

			window.__ModuleLoader__ = {
				load: function (definition) {
					var mod = definition.factory(function () { return window.React; });
					var ctx = {
						slots: {
							inject: function (name, cb) {
								if (!hostFor(name)) return function () {};
								cb();
								return function () {};
							},
							register: function (registration, Component) {
								var host = hostFor(registration.name);
								if (!host) return function () {};
								var mount = document.createElement("div");
								mount.style.display = "contents";
								host.appendChild(mount);
								var root = window.ReactDOM.createRoot(mount);
								root.render(window.React.createElement(Component, { wide: true }));
								return function () {
									try { root.unmount(); } catch (error) { /* already gone */ }
									mount.remove();
								};
							}
						},
						effect: function (cb) { try { cb(); } catch (error) { /* ignore */ } }
					};
					mod.apply(ctx);
					// Handy for screenshots and for CI: open the settings panel on load.
					if (/[?&]panel=1/.test(location.search)) {
						setTimeout(function () {
							// The seat already holds the shell's own gear button, so the
							// plugin's entry is the last one in it.
							var buttons = footer.querySelectorAll("button");
							var trigger = buttons.length > 0 ? buttons[buttons.length - 1] : null;
							if (trigger) trigger.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
						}, 800);
					}
					note.textContent = "插件已加载 —— 点侧边栏底部的「充值」看动画，右键它打开设置面板（预览里的素材只在本次会话有效）。";
				}
			};
		})();
	</script>
	<script src="./lib/client.js"></script>
</body>
</html>
